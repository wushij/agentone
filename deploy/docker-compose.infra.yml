# 仅启动基础设施（本地开发用）
# 用法: cd deploy && docker compose -f docker-compose.infra.yml up -d

services:
  mysql:
    image: mysql:8.0
    container_name: agentone-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agentone}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ../sql/migrations/03_extended_schema.sql:/docker-entrypoint-initdb.d/03_extended_schema.sql:ro
      - ../sql/migrations/04_v11_schema.sql:/docker-entrypoint-initdb.d/04_v11_schema.sql:ro
      - ../sql/migrations/05_user_avatar_mediumtext.sql:/docker-entrypoint-initdb.d/05_user_avatar_mediumtext.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: agentone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-agentone}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/pg_init.sql:/docker-entrypoint-initdb.d/00_pg_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 向量库（§8.1）：启用后后端设 QDRANT_URL=http://qdrant:6333
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentone-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  qdrant_data:
